# Baut bei jedem Tag v* die Programmdateien und hängt sie an ein Release:
#   dl24-akkutest-linux          Linux, ein einziges Programm (PyInstaller)
#   DL24-Akkutest-windows.zip    Windows, Programmordner mit DL24-Akkutest.exe
# Danach macht installer.yml daraus die Doppelklick-Dateien und die setup.exe.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Die Versionsnummer steht in akkutest/VERSION. Weicht der Tag ab, stimmt
      # die Anzeige im Programm nicht mit dem Release überein.
      - name: Version gegen den Tag prüfen
        run: |
          VER=$(tr -d ' \n' < akkutest/VERSION)
          echo "VERSION=$VER  Tag=${GITHUB_REF_NAME#v}"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$VER" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::akkutest/VERSION ($VER) passt nicht zum Tag ($GITHUB_REF_NAME)"; exit 1
          fi
      - name: Qt-Bibliotheken
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3
      - run: pip install -r requirements.txt
      - name: Tests
        run: ./tests/alle.sh

  linux:
    needs: tests
    # Auf der älteren Ubuntu bauen: ein Programm, das gegen eine alte glibc
    # gebaut ist, läuft auch auf neueren Systemen - umgekehrt nicht.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3
      - run: pip install -r requirements.txt pyinstaller
      # bleak lädt sein Bluetooth-Hinterteil je nach System erst zur Laufzeit -
      # das sieht PyInstaller nicht von allein.
      - name: Bündeln
        run: >
          pyinstaller --onefile --name dl24-akkutest-linux
          --add-data "akkutest/VERSION:akkutest" --add-data "icon.png:."
          --collect-submodules bleak --collect-submodules dbus_fast --hidden-import hid
          --exclude-module tkinter --exclude-module unittest
          start.py
      - name: Gebündeltes Programm prüfen
        run: |
          ls -lh dist/dl24-akkutest-linux
          QT_QPA_PLATFORM=offscreen ./dist/dl24-akkutest-linux --pruefen
          QT_QPA_PLATFORM=offscreen ./dist/dl24-akkutest-linux --fenster-probe
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          retention-days: 7
          path: dist/dl24-akkutest-linux

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Bündeln
        run: >
          pyinstaller --onedir --noconsole --name DL24-Akkutest --icon icon.ico
          --add-data "akkutest/VERSION;akkutest" --add-data "icon.png;."
          --collect-submodules bleak --collect-submodules winrt --hidden-import hid
          --exclude-module tkinter --exclude-module unittest
          start.py
      # Ohne Konsole gibt es keine Ausgabe - gewertet wird die Rückgabe
      - name: Gebündeltes Programm prüfen
        shell: pwsh
        run: |
          $p = Start-Process dist\DL24-Akkutest\DL24-Akkutest.exe -ArgumentList "--pruefen" -PassThru -Wait
          Write-Host "Rückgabe: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "--pruefen endete mit $($p.ExitCode)" }
          $p = Start-Process dist\DL24-Akkutest\DL24-Akkutest.exe -ArgumentList "--fenster-probe" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "--fenster-probe endete mit $($p.ExitCode)" }
      - name: Als ZIP packen
        shell: pwsh
        run: Compress-Archive -Path dist\DL24-Akkutest\* -DestinationPath DL24-Akkutest-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 7
          path: DL24-Akkutest-windows.zip

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: anhaenge
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DL24 Akkutest ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            anhaenge/linux/*
            anhaenge/windows/*

  # Ein Release, das der Workflow selbst anlegt, löst keine weiteren Workflows
  # aus - deshalb hier direkt aufrufen.
  doppelklick:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/installer.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write

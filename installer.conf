# ===== Einstellungen für die Doppelklick-Installer =====
# Der Workflow .github/workflows/installer.yml baut daraus bei jedem Release:
#   - Linux: drei Doppelklick-Dateien (.desktop) und das Installationsskript
#   - Windows: dl24-akkutest-setup.exe
# Zeilen mit "#" davor sind aus.

APP_NAME="DL24 Akkutest"
APP_ID="dl24-akkutest"
APP_COMMENT="Akkus mit der Atorch DL24 testen: Kapazitaet, Verlust, Innenwiderstand"

# --- Linux ---
# Ein einziges Programm (PyInstaller), alles enthalten
LINUX_FILE="dl24-akkutest-linux"
# Qt 6 braucht fuer X11 libxcb-cursor, das liegt nicht ueberall bei
PKGS_ARCH="xcb-util-cursor"
PKGS_DEB="libxcb-cursor0"
PKGS_RPM="xcb-util-cursor"
PKGS_SUSE="libxcb-cursor0"

# --- Windows ---
WINDOWS_FILE="DL24-Akkutest-windows.zip"
WINDOWS_EXE="DL24-Akkutest.exe"

# --- Symbol ---
ICON_PNG="icon.png"
ICON_ICO="icon.ico"
